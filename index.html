<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ON Custom Images 4K | Auto-Calibrator & Flow Optimizer</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .drop-zone { background: var(--card); border: 2px dashed #475569; border-radius: 8px; height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden;}
        .drop-zone.active { border-color: var(--accent); }
        .drop-zone img { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; z-index: 1;}
        .drop-zone span { z-index: 2; color: #94a3b8; font-size: 14px; pointer-events: none; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px;}
        input[type="file"] { display: none; }
        .controls { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px;}
        button { background: var(--accent); color: #0f172a; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #log { background: #000; color: #10b981; padding: 15px; border-radius: 4px; font-family: monospace; height: 150px; overflow-y: auto; font-size: 12px;}
        canvas { display: block; margin: auto; max-width: 100%; border: 1px solid #334155; background: #fff; }
        .prompt-box { background: #000; color: #fff; padding: 15px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; font-size: 11px;}
        .input-group { display: flex; gap: 10px; flex-wrap: wrap;}
        .input-group input, .input-group select { flex: 1; min-width: 200px; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 ON Custom Images 4K: Flow Optimizer</h1>
        
        <!-- Generador de Prompts -->
        <div class="controls">
            <h3>1. Generador de Prompts Maestros</h3>
            <div class="input-group">
                <input type="text" id="char-desc" placeholder="Descripción (ej: Mujer cyberpunk, cabello azul, chaqueta de cuero)">
                <select id="target-ai">
                    <option value="flow">Google Flow / Veo (Video)</option>
                    <option value="mj">Midjourney v6</option>
                    <option value="flux">Flux / Stable Diffusion</option>
                </select>
                <button onclick="generatePrompts()">Generar 5 Prompts</button>
            </div>
            <div id="prompts-output" class="prompt-box" style="display:none;"></div>
        </div>

        <!-- Cargador de Imágenes -->
        <div class="controls">
            <h3>2. Cargador y Auto-Calibrador 1:1</h3>
            <p>Sube las 5 imágenes generadas. El sistema detectará los rostros y los escalará matemáticamente.</p>
            <div class="grid">
                <label class="drop-zone" id="zone-0"><input type="file" accept="image/*" onchange="handleFile(0, this)"><span>📷 1. Busto Frontal (Ancla)</span></label>
                <label class="drop-zone" id="zone-1"><input type="file" accept="image/*" onchange="handleFile(1, this)"><span>👤 2. Perfil Derecho</span></label>
                <label class="drop-zone" id="zone-2"><input type="file" accept="image/*" onchange="handleFile(2, this)"><span>👤 3. Perfil Izquierdo</span></label>
                <label class="drop-zone" id="zone-3"><input type="file" accept="image/*" onchange="handleFile(3, this)"><span>👕 4. Cuerpo (Sin Cabeza)</span></label>
                <label class="drop-zone" id="zone-4"><input type="file" accept="image/*" onchange="handleFile(4, this)"><span>🎒 5. Espalda (Limpia)</span></label>
            </div>
            <button id="btn-process" onclick="processAndAssemble()" disabled>⚙️ Calibrar 1:1 y Ensamblar 4K</button>
            <div id="log">[Sistema] Esperando carga de modelos de IA...</div>
        </div>

        <!-- Canvas de Salida -->
        <div class="controls" style="text-align: center;">
            <h3>3. Character Sheet Master (4K)</h3>
            <canvas id="sheet-canvas" width="3840" height="2160"></canvas>
            <button onclick="downloadSheet()" style="margin-top:15px;">💾 Descargar PNG 4K</button>
        </div>
    </div>

    <script>
        const state = {
            images: [null, null, null, null, null],
            refs: [null, null, null, null, null],
            targetFaceHeight: 0
        };

        const log = (msg) => {
            const l = document.getElementById('log');
            l.innerHTML += `<br>${msg}`;
            l.scrollTop = l.scrollHeight;
        };

        // Cargar Modelos de Face-API
        async function init() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                log('[Éxito] Modelos de Visión por Computadora cargados.');
            } catch (err) {
                log('[Error] No se pudieron cargar los modelos. Asegúrate de usar Live Server o HTTPS.');
            }
        }
        init();

        function handleFile(index, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        state.images[index] = img;
                        const zone = document.getElementById(`zone-${index}`);
                        zone.innerHTML = `<img src="${e.target.result}"><span>Listo</span>`;
                        checkReady();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function checkReady() {
            // Necesitamos al menos las 3 primeras (Frente y Perfiles) para calibrar
            if (state.images[0] && state.images[1] && state.images[2]) {
                document.getElementById('btn-process').disabled = false;
            }
        }

        async function getFaceHeight(img) {
            // Creamos un canvas temporal para face-api
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const ctx = tempCanvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const detection = await faceapi.detectSingleFace(tempCanvas, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
            if (!detection) return 0;

            // Landmarks: 27 (base de la nariz/entrecejo) y 8 (punta de la barbilla)
            const top = detection.landmarks.positions[27].y;
            const bottom = detection.landmarks.positions[8].y;
            return Math.abs(bottom - top);
        }

        async function processAndAssemble() {
            log('Procesando... Calculando métricas faciales...');
            
            // 1. Obtener altura de referencia del Ancla (Frente)
            const anchorHeight = await getFaceHeight(state.images[0]);
            if (anchorHeight === 0) {
                log('[Error] No se detectó rostro en la imagen Frontal (Ancla).');
                return;
            }
            state.targetFaceHeight = anchorHeight;
            log(`Ancla Frontal: Altura facial = ${anchorHeight.toFixed(1)}px`);

            const canvas = document.getElementById('sheet-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f1f5f9'; // Fondo gris neutro
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Función de dibujo inteligente
            async function drawCalibrated(img, targetX, targetY, targetWidth) {
                if(!img) return;
                const fH = await getFaceHeight(img);
                if (fH === 0) {
                    ctx.drawImage(img, targetX, targetY, targetWidth, (img.height/img.width)*targetWidth);
                    return;
                }
                const scale = anchorHeight / fH;
                const newW = img.width * scale;
                const newH = img.height * scale;
                // Centrado o alineación lateral
                ctx.drawImage(img, targetX, targetY, newW, newH);
                log(`Imagen calibrada. Escala aplicada: ${(scale*100).toFixed(1)}%`);
            }

            // 3. Layout de Ensamblaje Zuppelli (Optimizado para 3840x2160)
            const margin = 50;
            const bustW = 1200;
            
            // Frente (Centro Superior)
            await drawCalibrated(state.images[0], (canvas.width - bustW)/2, margin, bustW);

            // Perfiles (Izq y Der del frente, misma altura)
            const profW = 600;
            await drawCalibrated(state.images[2], margin, margin + 200, profW); // Izq
            await drawCalibrated(state.images[1], canvas.width - margin - profW, margin + 200, profW); // Der

            // Cuerpos (Abajo, ocupando el ancho)
            if(state.images[3]) {
                const bodyW = canvas.width / 2 - margin;
                ctx.drawImage(state.images[3], margin, 1200, bodyW, (state.images[3].height/state.images[3].width)*bodyW);
            }
            if(state.images[4]) {
                const bodyW = canvas.width / 2 - margin;
                ctx.drawImage(state.images[4], canvas.width/2 + margin/2, 1200, bodyW, (state.images[4].height/state.images[4].width)*bodyW);
            }

            log('¡Ensamblaje 4K completado! Listo para exportar.');
        }

        function downloadSheet() {
            const canvas = document.getElementById('sheet-canvas');
            const link = document.createElement('a');
            link.download = 'CharacterSheet_4K_Flow.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function generatePrompts() {
            const desc = document.getElementById('char-desc').value || "Personaje realista, rasgos detallados";
            const target = document.getElementById('target-ai').value;
            const out = document.getElementById('prompts-output');
            
            let p1 = "", p2 = "";
            if(target === 'mj') {
                p1 = " --ar 3:4 --style raw --cref [URL_REF] --cw 100";
                p2 = " --ar 1:1 --style raw --cref [URL_REF] --cw 100";
            } else if (target === 'flow') {
                p1 = " Fotografía cinematográfica 4K, iluminación de estudio, lente 85mm f/1.8.";
                p2 = " Fotografía de perfil técnico, misma iluminación y vestuario.";
            } else {
                p1 = " (Use IP-Adapter weight 1.0)";
                p2 = " (Use IP-Adapter weight 1.0)";
            }

            const prompts = `
PROMPT 1 (ANCLA FRONTAL):
Exact 1:1 physical clone of ${desc}, front bust portrait, maximum skin texture, pores, micro-wrinkles. Neutral light gray studio background.${p1}

PROMPT 2 (PERFIL DER):
Exact 1:1 physical clone of ${desc}, right side profile 90 degrees, focusing on jawline and ear alignment. Neutral light gray studio background.${p2}

PROMPT 3 (PERFIL IZQ):
Exact 1:1 physical clone of ${desc}, left side profile 90 degrees, focusing on skull structure. Neutral light gray studio background.${p2}

PROMPT 4 (CUERPO SIN CUELLO):
NO HEAD, NO NECK. Headless full body front view of ${desc}. Clean horizontal crop right at the shirt collar seam line. Neutral pose, arms resting at sides. Showing complete outfit strictly matching reference.${p1}

PROMPT 5 (ESPALDA):
Full body back view of ${desc}, standing straight seen directly from behind, NO backpack, NO objects. Showing the back of the exact same outfit.${p1}

PROMPT MAESTRO PARA GOOGLE FLOW (Copiar y pegar al generar el video):
"Cinematic tracking shot of the character from the reference sheet. Maintain exact facial consistency, exact clothing texture, and identical physical proportions across all frames. 4K, highly detailed, temporal stability."
            `;
            out.innerText = prompts;
            out.style.display = 'block';
        }
    </script>
</body>
</html>
